site_name: TaskFlow API
site_description: Production-oriented REST API built with FastAPI

docs_dir: docs

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md

  - Getting Started:
      - Installation: getting-started.md

  - Architecture:
      - Overview: architecture.md
      - Authentication: authentication.md

  - API:
      - Endpoints: api.md
      - Examples: examples.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables