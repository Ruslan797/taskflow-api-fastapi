<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contact-info">
        <div>
            <strong>Jetzt anrufen</strong>
            <a href="tel:+4916095070736">+49 160 95 0707 36</a>
        </div>

        <div>
            <strong>Vor-Ort-Service</strong>
            <span>Hamburg &amp; Norderstedt</span>
        </div>
    </div>

    <div class="brand">
        <div class="laptop-icon">
            <div class="laptop-screen"></div>
            <div class="laptop-base"></div>
        </div>

        <h1>IT-Service <span>Hamburg · Norderstedt</span></h1>
    </div>

    <p class="services-line">
       PC- &amp; Laptop-Service · Windows · Linux · Datenübertragung · Aufrüstung · Datensicherung · Webdesign
    </p>

    <div class="main-content">

        <img
            class="hero-image"
            src="images/TaskFlow_Hamburg.png"
            alt="Hamburg"
        >

        <div class="login-section">
            <h2>Anmelden</h2>

            <form>

                <label for="email">E-Mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="password">Passwort</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    maxlength="128"
                    required
                >

                <button type="submit">Anmelden</button>
            </form>
                <p class="register-link">
                    Noch kein Konto?
                    <a href="register.html">Jetzt registrieren</a>
                </p>
        </div>

    </div>

</body>
</html>
