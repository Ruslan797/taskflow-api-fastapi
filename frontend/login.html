<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden | TaskFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-page">
        <h1>Anmelden</h1>
        <p>Melden Sie sich bei Ihrem TaskFlow-Konto an.</p>

        <form id="login-form">
            <label for="login-email">E-Mail</label>

            <input
                type="email"
                id="login-email"
                name="email"
                required
            >

            <label for="login-password">Passwort</label>

            <input
                type="password"
                id="login-password"
                name="password"
                minlength="8"
                maxlength="128"
                required
            >

            <button type="submit">Anmelden</button>

            <p id="login-message"></p>
        </form>
                    
    </div>

    <script src="login.js"></script>
</body>

</html>
